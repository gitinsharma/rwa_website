# Loaded automatically by `docker compose` alongside docker-compose.yml.
# Turns the production-shaped base file into a local dev loop: hot-reloading
# Next.js dev server, and db/storage ports published to the host so you can
# reach them with a local psql/Prisma Studio/S3 client. `proxy` is skipped —
# hit the app directly at http://localhost:3000.

services:
  web:
    build:
      target: deps
    # `deps` only runs `npm ci`; the Prisma client's query engine is
    # generated here on start instead, so it stays in sync with the
    # bind-mounted schema without needing a full image rebuild.
    command: sh -c "npx prisma generate && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development

  db:
    ports:
      - "5432:5432"

  storage:
    ports:
      - "9000:9000"
      - "9001:9001"

  proxy:
    profiles:
      - donotstart
