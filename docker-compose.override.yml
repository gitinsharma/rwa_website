# Loaded automatically by `docker compose` alongside docker-compose.yml.
# Turns the production-shaped base file into a local dev loop: hot-reloading
# Next.js dev server, and db/storage ports published to the host so you can
# reach them with a local psql/Prisma Studio/S3 client. `proxy` is skipped —
# hit the app directly at http://localhost:3000.

services:
  web:
    build:
      target: deps
    # `deps` only runs `npm ci`; the Prisma client's query engine is
    # generated here on start instead, so it stays in sync with the
    # bind-mounted schema without needing a full image rebuild.
    #
    # Deliberately `next dev` without --turbopack (unlike package.json's
    # `dev` script, which native/non-Docker runs should still use):
    # Turbopack's dev server has repeatedly corrupted its own .next build
    # manifest under this container setup (ENOENT on
    # .next/static/development/_buildManifest.js.tmp.* — a write race, not
    # a virtiofs/mount issue, since .next is an isolated anonymous volume
    # below), requiring a `docker compose up -d -V web` to recover each
    # time. Plain webpack's dev server hasn't shown the same failure mode.
    command: sh -c "npx prisma generate && npx next dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      # Colima's virtiofs mount doesn't reliably forward inotify events into
      # the container, so Turbopack's watcher can silently miss host-side
      # edits. Polling is slightly heavier but actually catches changes.
      WATCHPACK_POLLING: "true"

  db:
    ports:
      - "5432:5432"

  storage:
    ports:
      - "9000:9000"
      - "9001:9001"

  proxy:
    profiles:
      - donotstart
